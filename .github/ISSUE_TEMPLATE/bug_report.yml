name: Bug report
description: Something doesn't work as documented, crashes, or is slower than it should be.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include error messages and panics in full.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code or example command that shows the problem.
      render: rust
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Rust
        - C++
        - C
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Engine version
      description: Commit hash or version (`git rev-parse --short HEAD` in the engine checkout, or from Cargo.lock).
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and GPU
      placeholder: macOS 26, Apple M4 / Windows 11, RTX 4070 / Ubuntu 24.04, Intel UHD
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, screenshots, benchmark numbers (release builds, please).
