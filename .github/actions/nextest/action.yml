name: Nextest
description: Install the pinned test runner, reusing its cached binary
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin/cargo-nextest${{ runner.os == 'Windows' && '.exe' || '' }}
        key: nextest-${{ runner.os }}-${{ runner.arch }}-0.9.151
    - uses: taiki-e/install-action@v2
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        tool: nextest@0.9.151
    - shell: bash
      run: cargo nextest --version
