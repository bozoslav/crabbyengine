name: Windows linker
description: Select the MSVC-compatible LLD bundled with the active Rust toolchain
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $sysroot = rustc --print sysroot
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $linker = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe'
        if (!(Test-Path $linker)) { throw "Rust's bundled linker is missing: $linker" }
        & $linker -flavor link --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
