# Comments a pull request's benchmark comparison (bench.yml) on the pull
# request. A separate workflow because a pull_request run from a fork gets a
# read-only token and can't comment; this one runs in the base repository
# after it with `pull-requests: write`.
#
# workflow_run is safe here because this job never checks out or runs the
# pull request's code and has no secrets: it reads two small files from the
# run's artifact (the pull request number and the Markdown table), checks the
# number against the run's own head commit, and posts the text. The text
# came from the pull request's run, so it is shortened, `@` mentions are
# defused, and it must start with bench_track's marker line.
#
# It comments when a benchmark moved beyond noise. When an earlier comment
# exists, it updates that one instead (also when nothing moves any more), so
# a pull request has at most one benchmark comment and it is current.

name: Benchmark comment

on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    name: Comment the comparison
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          dir="$RUNNER_TEMP/comparison"
          if ! gh run download "$RUN_ID" --repo "$REPO" --name bench-comparison --dir "$dir"; then
            echo "The run has no comparison (nothing was measured)."
            exit 0
          fi
          pr=$(head -c 20 "$dir/pr-number" | tr -d '[:space:]')
          if ! printf '%s' "$pr" | grep -Eq '^[0-9]+$'; then
            echo "::error::not a pull request number: $pr"
            exit 1
          fi
          # The number must name a pull request whose head is the measured
          # commit; a newer push gets its own run and comment.
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "Pull request #$pr has moved on to $head; skipping the comment for $HEAD_SHA."
            exit 0
          fi
          body="$RUNNER_TEMP/body.md"
          head -c 60000 "$dir/comparison.md" | sed 's/@/@\xe2\x80\x8b/g' > "$body"
          first=$(head -n 1 "$body")
          if ! printf '%s' "$first" | grep -Eq '^<!-- bench-track: slower=[0-9]+ faster=[0-9]+ -->$'; then
            echo "::error::the comparison doesn't start with bench_track's marker"
            exit 1
          fi
          moved=$(printf '%s' "$first" | sed -E 's/.*slower=([0-9]+) faster=([0-9]+).*/\1 \2/' | awk '{print $1 + $2}')
          printf '\n<sub>Commit %s. Instruction counts under cachegrind; see crates/ponko_bench/README.md, "Tracking results over time".</sub>\n' "$HEAD_SHA" >> "$body"
          existing=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- bench-track:"))) | .id' | tail -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" > /dev/null
            echo "Updated comment $existing on #$pr."
          elif [ "$moved" -gt 0 ]; then
            gh api --method POST "repos/$REPO/issues/$pr/comments" -F "body=@$body" > /dev/null
            echo "Commented on #$pr."
          else
            echo "Nothing moved beyond noise; no comment."
          fi
