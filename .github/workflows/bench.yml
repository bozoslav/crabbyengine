# Benchmark tracking (crates/ponko_bench README, "Tracking results over
# time"). Counts the instructions of a few small workloads under cachegrind:
# a count doesn't depend on what else the runner is doing, so it is stable on
# shared runners, where wall-clock times are not.
#
# - pull_request: counts the pull request (its merge commit) and its base
#   with the same workloads (the pull request's), compares the medians of
#   three runs each, and writes the table to the job summary and to the
#   `bench-comparison` artifact. bench-comment.yml then comments on the pull
#   request when a benchmark moved beyond noise (or updates its earlier
#   comment). Only changes that can move the numbers start it.
# - push to main: counts the commit and adds it to the history branch
#   `bench-history` as `<machine>/<commit>.json`, with a README table of
#   every benchmark over time.
# - a version tag: the same, as `releases/<tag>/<machine>.json`.
# - workflow_dispatch with `ref`: measures that revision (for example the
#   tag v0.1.0) with the dispatching branch's workloads, and records it like
#   a tag if `ref` is one, else like a commit.
#
# Not part of the "CI passed" check: a benchmark never blocks a merge. No
# secrets: the history push uses this run's GITHUB_TOKEN.

name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "crates/ponko_ecs/**"
      - "crates/ponko_macros/**"
      - "crates/ponko_bench/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/bench-*.sh"
      - ".github/workflows/bench.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Revision to measure with this branch's workloads (a tag such as v0.1.0, a branch or a commit)
        required: true

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit on main
# keeps its own.
concurrency:
  group: bench-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  # One target folder for both trees: dependencies build once.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Instruction counts depend on the compiler and the CPU's features, so
  # history files say which runner image made them.
  BENCH_MACHINE: github-ubuntu-24.04-x64

jobs:
  compare:
    name: Instruction counts against the base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: new
      - uses: actions/checkout@v7
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Install valgrind
        run: bash new/scripts/ci-apt-install.sh valgrind
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: new -> ../target
          key: bench
          save-if: false
      - name: Count the pull request
        run: bash new/scripts/bench-counts.sh new new "$RUNNER_TEMP/new.json" "$BENCH_MACHINE"
      # The base may not build the pull request's workloads (a workload that
      # uses an API the pull request adds): then there is nothing to compare.
      - name: Count the base with the same workloads
        id: base
        continue-on-error: true
        run: bash new/scripts/bench-counts.sh base new "$RUNNER_TEMP/base.json" "$BENCH_MACHINE"
      - name: Compare
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_OUTCOME: ${{ steps.base.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/comparison"
          out="$RUNNER_TEMP/comparison"
          echo "$PR" > "$out/pr-number"
          cp "$RUNNER_TEMP/new.json" "$out/new.json"
          if [ "$BASE_OUTCOME" = success ]; then
            cp "$RUNNER_TEMP/base.json" "$out/base.json"
            "$CARGO_TARGET_DIR/release/bench_track" compare \
              --base-label base --new-label "pull request" \
              "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/new.json" > "$out/comparison.md"
          else
            printf '%s\n\n%s\n' '<!-- bench-track: slower=0 faster=0 -->' \
              "The base didn't build this pull request's benchmark workloads; nothing to compare." \
              > "$out/comparison.md"
          fi
          cat "$out/comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-comparison
          path: ${{ runner.temp }}/comparison
          retention-days: 30

  record:
    name: Instruction counts into the history
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Pushes to the bench-history branch.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: tool
      - name: Which revision
        id: what
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if ! printf '%s' "$INPUT_REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error::ref may only hold letters, digits and . _ / -"
              exit 1
            fi
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            git -C tool fetch --quiet --tags origin
            if git -C tool show-ref --verify --quiet "refs/tags/$INPUT_REF"; then
              echo "tag=$INPUT_REF" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            if [ "$REF_TYPE" = tag ]; then
              echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v7
        with:
          path: engine
          ref: ${{ steps.what.outputs.ref }}
          persist-credentials: false
      - name: Install valgrind
        run: bash tool/scripts/ci-apt-install.sh valgrind
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> ../target
          key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Count
        run: bash tool/scripts/bench-counts.sh engine tool "$RUNNER_TEMP/result.json" "$BENCH_MACHINE"
      - name: Add to the history branch
        env:
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          sha=$(git -C engine rev-parse HEAD)
          if [ -n "$TAG" ]; then
            path="releases/$TAG/$BENCH_MACHINE.json"
          else
            path="$BENCH_MACHINE/$sha.json"
          fi
          cd tool
          bash scripts/bench-history-push.sh "$CARGO_TARGET_DIR/release/bench_track" "$RUNNER_TEMP/result.json" "$path"
          echo "Recorded \`$path\` on the \`bench-history\` branch; its README shows the history." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-result
          path: ${{ runner.temp }}/result.json
          retention-days: 90
