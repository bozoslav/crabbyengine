# One failure never hides another: matrices don't fail fast, test steps run
# even after an earlier step failed, and --no-fail-fast runs every suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: ""
          - name: profiling feature
            args: --features profiling
          - name: ECS without parallel
            args: -p crabby_ecs --no-default-features
          - name: engine without window or audio
            args: -p crabbyengine --no-default-features
          - name: engine without window
            args: -p crabbyengine --no-default-features --features audio
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.args }}

  # One job per OS: compiling is ~90% of the time, so build once and run
  # every test there. Each feature combination is its own step, and every
  # step runs even if an earlier one failed, so one failure never hides
  # another. (One job per test file meant ~110 jobs that each compiled the
  # workspace, queued behind GitHub's limit of 5 macOS jobs at a time.)
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every crate's unit, integration and doc tests; also builds the examples.
      - name: Tests (default features)
        run: cargo test --workspace --no-fail-fast
      - name: Tests, ECS without rayon
        if: ${{ !cancelled() }}
        run: cargo test -p crabby_ecs --tests --no-fail-fast --no-default-features
      - name: Tests, engine without a window
        if: ${{ !cancelled() }}
        run: cargo test -p crabbyengine --tests --no-fail-fast --no-default-features --features audio
      # Systems called through subsecond's jump table (no dx attached) behave the same.
      - name: Tests, engine with hotpatch
        if: ${{ !cancelled() }}
        run: cargo test -p crabbyengine --no-fail-fast --features hotpatch --test headless --test determinism --test events
      - name: Build examples
        if: ${{ !cancelled() }}
        run: cargo build --workspace --examples

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build book

  miri:
    name: Miri (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Miri interprets every instruction; tests shrink their sizes under
    # cfg(miri). The timeout catches a regression instead of hanging CI.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Our unsafe code under the strict model, without rayon.
          - name: ECS, stacked borrows
            args: --tests --no-default-features
            flags: ""
          # The parallel path. rayon's dependency crossbeam-epoch trips Stacked
          # Borrows (not our code), and its global pool outlives main.
          - name: par_for_each, tree borrows
            args: --test parallel
            flags: -Zmiri-tree-borrows -Zmiri-ignore-leaks
    env:
      MIRIFLAGS: ${{ matrix.flags }}
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p crabby_ecs --no-fail-fast ${{ matrix.args }}

  native:
    name: C and C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native
      - name: Verify generated C header
        shell: bash
        run: |
          mkdir -p target
          cargo run -p crabby_ffi --example generate_header > target/crabby.generated.h
          python - <<'PYTHON'
          from pathlib import Path
          import difflib
          import sys
          # Git and cbindgen can produce different line endings on Windows.
          expected = Path("include/crabby.h").read_text().splitlines(keepends=True)
          actual = Path("target/crabby.generated.h").read_text().splitlines(keepends=True)
          sys.stdout.writelines(difflib.unified_diff(expected, actual, fromfile="checked in", tofile="generated"))
          sys.exit(expected != actual)
          PYTHON
      - run: cargo build -p crabby_ffi --release
      - run: cmake -S examples/cpp -B target/native -DCMAKE_BUILD_TYPE=Release -DCRABBY_LIBRARY_DIR=${{ github.workspace }}/target/release
      - run: cmake --build target/native --config Release
      - run: ctest --test-dir target/native -C Release --output-on-failure

  # The web build (wasm32): lint the browser-only code, and build the battle
  # demo the way the docs site does.
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - run: cargo clippy -p crabbyengine --target wasm32-unknown-unknown --examples
      - name: Find the wasm-bindgen version in Cargo.lock
        run: echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - run: web/build.sh battle

  # Single check for branch protection: passes only if every job above passed.
  # (Requiring one job keeps the rule valid when jobs are added or renamed.)
  ci-passed:
    name: CI passed
    if: always()
    needs: [fmt, clippy, test, docs, book, miri, native, web]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "Some jobs did not pass." && exit 1
          fi
