# Every check is its own job, so one failure never hides the others:
# each job reports pass/fail separately on the PR, matrices don't fail fast,
# and test jobs use --no-fail-fast so every test in a suite runs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            args: ""
          - name: profiling feature
            args: --features profiling
          - name: ECS without parallel
            args: -p crabby_ecs --no-default-features
          - name: engine without window or audio
            args: -p crabbyengine --no-default-features
          - name: engine without window
            args: -p crabbyengine --no-default-features --features audio
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA headers (audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.args }}

  # One job per test area and OS, so a failure points straight at what broke.
  # Areas map to files: crates/crabby_ecs/tests/<area>.rs, the engine's unit
  # tests, doctests and the benchmark crate's tests.
  test:
    name: Test ${{ matrix.area }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        area:
          - ecs-entities
          - ecs-queries
          - ecs-resources
          - ecs-commands
          - ecs-dynamic
          - ecs-parallel
          - ecs-without-parallel
          - engine
          - engine-headless
          - engine-ui
          - engine-tiles
          - engine-audio
          - engine-spatial
          - engine-reflect
          - engine-control
          - engine-determinism
          - engine-flow
          - engine-events
          - engine-without-window
          - mcp
          - ffi-unit
          - ffi-abi
          - ffi-game
          - ffi-media
          - ffi-reflect
          - ffi-tiles
          - ffi-flow
          - ffi-events
          - doctests
          - bench
        include:
          - { area: ecs-entities, args: -p crabby_ecs --test entities }
          - { area: ecs-queries, args: -p crabby_ecs --test queries }
          - { area: ecs-resources, args: -p crabby_ecs --test resources }
          - { area: ecs-commands, args: -p crabby_ecs --test commands }
          - { area: ecs-dynamic, args: -p crabby_ecs --test dynamic }
          - { area: ecs-parallel, args: -p crabby_ecs --test parallel }
          - { area: ecs-without-parallel, args: -p crabby_ecs --tests --no-default-features }
          - { area: engine, args: -p crabbyengine --lib }
          - { area: engine-headless, args: -p crabbyengine --test headless }
          - { area: engine-ui, args: -p crabbyengine --test ui }
          - { area: engine-tiles, args: -p crabbyengine --test tiles }
          - { area: engine-audio, args: -p crabbyengine --test audio }
          - { area: engine-spatial, args: -p crabbyengine --test spatial }
          - { area: engine-reflect, args: -p crabbyengine --test reflect }
          - { area: engine-control, args: -p crabbyengine --test control }
          - { area: engine-determinism, args: -p crabbyengine --test determinism }
          - { area: engine-flow, args: -p crabbyengine --test flow }
          - { area: engine-events, args: -p crabbyengine --test events }
          - { area: engine-without-window, args: -p crabbyengine --tests --no-default-features --features audio }
          - { area: mcp, args: -p crabby_mcp }
          - { area: ffi-unit, args: -p crabby_ffi --lib }
          - { area: ffi-abi, args: -p crabby_ffi --test abi }
          - { area: ffi-game, args: -p crabby_ffi --test game }
          - { area: ffi-media, args: -p crabby_ffi --test media }
          - { area: ffi-reflect, args: -p crabby_ffi --test reflect }
          - { area: ffi-tiles, args: -p crabby_ffi --test tiles }
          - { area: ffi-flow, args: -p crabby_ffi --test flow }
          - { area: ffi-events, args: -p crabby_ffi --test events }
          - { area: doctests, args: --workspace --doc }
          - { area: bench, args: -p crabby_bench }
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA headers (audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # ECS areas share one cache; engine-level areas share another.
          key: test-${{ startsWith(matrix.area, 'ecs') && 'ecs' || matrix.area }}
      - run: cargo test --no-fail-fast ${{ matrix.args }}

  examples:
    name: Build examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA headers (audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --examples

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA headers (audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build book

  miri:
    name: Miri (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Miri interprets every instruction; tests shrink their sizes under
    # cfg(miri). The timeout catches a regression instead of hanging CI.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Our unsafe code under the strict model, without rayon.
          - name: ECS, stacked borrows
            args: --tests --no-default-features
            flags: ""
          # The parallel path. rayon's dependency crossbeam-epoch trips Stacked
          # Borrows (not our code), and its global pool outlives main.
          - name: par_for_each, tree borrows
            args: --test parallel
            flags: -Zmiri-tree-borrows -Zmiri-ignore-leaks
    env:
      MIRIFLAGS: ${{ matrix.flags }}
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test -p crabby_ecs --no-fail-fast ${{ matrix.args }}

  native:
    name: C and C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install ALSA headers (audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native
      - name: Verify generated C header
        shell: bash
        run: |
          mkdir -p target
          cargo run -p crabby_ffi --example generate_header > target/crabby.generated.h
          python - <<'PYTHON'
          from pathlib import Path
          import difflib
          import sys
          # Git and cbindgen can produce different line endings on Windows.
          expected = Path("include/crabby.h").read_text().splitlines(keepends=True)
          actual = Path("target/crabby.generated.h").read_text().splitlines(keepends=True)
          sys.stdout.writelines(difflib.unified_diff(expected, actual, fromfile="checked in", tofile="generated"))
          sys.exit(expected != actual)
          PYTHON
      - run: cargo build -p crabby_ffi --release
      - run: cmake -S examples/cpp -B target/native -DCMAKE_BUILD_TYPE=Release -DCRABBY_LIBRARY_DIR=${{ github.workspace }}/target/release
      - run: cmake --build target/native --config Release
      - run: ctest --test-dir target/native -C Release --output-on-failure

  # Single check for branch protection: passes only if every job above passed.
  # (Requiring one job keeps the rule valid when jobs are added or renamed.)
  ci-passed:
    name: CI passed
    if: always()
    needs: [fmt, clippy, test, examples, docs, book, miri, native]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "Some jobs did not pass." && exit 1
          fi
