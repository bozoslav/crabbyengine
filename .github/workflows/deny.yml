# Dependency audit with cargo-deny, configured by deny.toml: licenses,
# security advisories, banned and duplicate crates, allowed sources
# (CONTRIBUTING.md, "Dependency audit").
#
# - Pull requests that change Cargo.toml, Cargo.lock or deny.toml run every
#   check and fail on a problem. A check that is skipped by the path filter
#   can't be a required status, so this workflow is not part of "CI passed":
#   read its result on the pull request.
# - Every Monday on `main`: the same checks, because the advisory database
#   changes without a commit here. A new advisory opens (or updates) one
#   issue, and the issue is closed once the audit is clean again.
#
# No secrets and no pull_request_target. The pull request jobs have a
# read-only token and only read the pull request's files (cargo-deny reads
# Cargo.lock and deny.toml; it builds and runs nothing). Only the issue job
# gets `issues: write`, and never runs on a pull request.

name: Dependency audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - deny.toml
      - .github/workflows/deny.yml
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned: a new cargo-deny can add checks and fail a build nobody changed.
  # Update it on purpose, together with any `deny.toml` change it needs.
  CARGO_DENY_VERSION: 0.20.2

jobs:
  # Deterministic: a result changes only when the dependency graph or the
  # policy does.
  policy:
    name: Licenses, bans and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      # -D warnings: a `skip` or `ignore` entry that matches nothing any more
      # is an error too, so exceptions don't outlive their reason.
      - run: cargo deny --locked --color never check -D warnings bans licenses sources

  # Changes with the advisory database, not with a commit.
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Check advisories
        run: |
          set -o pipefail
          cargo deny --locked --color never check -D warnings advisories 2>&1 | tee advisories.txt
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && github.event_name != 'pull_request' }}
        with:
          name: advisories
          path: advisories.txt
          retention-days: 14

  # The weekly run only (and a manual run on main): open or update the issue
  # when advisories were found, close it when they are gone.
  issue:
    name: Advisory issue
    needs: advisories
    if: ${{ always() && github.repository == 'ponkoengine/ponko' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.advisories.result != 'cancelled' && needs.advisories.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED: ${{ needs.advisories.result == 'failure' }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/audit-issue.py selftest
      - uses: actions/download-artifact@v8
        if: ${{ env.FAILED == 'true' }}
        with:
          name: advisories
      - name: Open, update or close the issue
        run: |
          [ -f advisories.txt ] || : > advisories.txt
          python3 scripts/audit-issue.py sync advisories.txt "$FAILED"
