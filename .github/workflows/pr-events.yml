# Pull request events that don't change the code: label changes and title or
# description edits. They used to start ci.yml, where each one began a whole
# run and cancelled the one in progress (agents label a pull request right
# after opening it). Here they cost a few seconds, and nothing in this file
# is named "CI passed", the required check, so a run of it can never stand
# in for a ci.yml result on the same commit.

name: PR events

on:
  pull_request:
    types: [edited, labeled]

permissions:
  contents: read

jobs:
  # ci.yml checks the title and description when the pull request opens or
  # gets new commits; this re-checks them after an edit. Same secret, same
  # script; pull requests from forks don't get secrets, and skip it.
  # This check isn't required, and the pull request's "CI passed" stays green
  # after an edit, so a leak turns the pull request back into a draft (which
  # can't merge), cancels auto-merge and labels it `text-leak`. Once an edit
  # takes the leak out, the label goes and the pull request is ready again.
  text-leaks:
    name: PR text leak check
    if: github.event.action == 'edited' && (github.event.changes.title || github.event.changes.body)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Pull request title and description
        id: text
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.txt"
          scripts/leak-check.sh text "$RUNNER_TEMP/pr.txt"
      - name: Hold the pull request
        if: failure() && steps.text.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --disable-auto || true
          gh pr ready "$PR" --repo "$REPO" --undo || true
          gh pr edit "$PR" --repo "$REPO" --add-label text-leak
          echo "::error::The title or description has a leak: the pull request is a draft until an edit takes it out."
      - name: Release a held pull request
        if: success() && contains(github.event.pull_request.labels.*.name, 'text-leak')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --remove-label text-leak
          gh pr ready "$PR" --repo "$REPO"

  # Adding `full-ci` runs the full matrix on the pull request's branch. A
  # workflow_dispatch run is ci.yml's full tier, and its "CI passed" lands on
  # the same head commit. (A labelled pull request's later pushes run the
  # full tier from ci.yml itself.) The GITHUB_TOKEN may start
  # workflow_dispatch runs; fork pull requests get a read-only token, so a
  # maintainer starts those from the Actions tab instead.
  full-ci:
    name: Start full CI
    if: github.event.action == 'labeled' && github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch ci.yml on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Fork pull request: run CI on it from the Actions tab."
            exit 1
          fi
          gh workflow run ci.yml --repo "$REPO" --ref "$HEAD_REF"
          echo "Started the full CI matrix on $HEAD_REF."
