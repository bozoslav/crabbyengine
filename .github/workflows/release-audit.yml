# Every version of our crates on crates.io must have a git tag (v0.0.2 for
# 0.0.2). Releases go through release.yml, which refuses to publish without
# the tag; this catches a crate published by hand. A failure says which
# version to tag (see "Releasing" in CONTRIBUTING.md).

name: Release audit

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tags:
    name: Published versions have tags
    if: github.repository == 'ponkoengine/ponko'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/release-check.py published
