name: Release

# Push a tag like v1.0.0 (on a commit of main whose CI passed):
#   - builds the C library on each OS and attaches it, with the headers,
#     to a GitHub release whose notes are that version's CHANGELOG section;
#   - publishes the crates to crates.io if the CARGO_REGISTRY_TOKEN secret
#     is set (`gh secret set CARGO_REGISTRY_TOKEN`); otherwise that job says
#     so and does nothing, and can be re-run once the secret exists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  c-library:
    name: C library (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ponko_ffi
      - name: Package
        shell: bash
        run: |
          dir="ponko-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp include/crabby.h include/crabby.hpp "$dir/include/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$dir/"
          for f in libponko_ffi.a libponko_ffi.so libponko_ffi.dylib ponko_ffi.lib ponko_ffi.dll ponko_ffi.dll.lib; do
            if [ -f "target/release/$f" ]; then cp "target/release/$f" "$dir/lib/"; fi
          done
          ls -R "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ponko-*.*z*

  github-release:
    name: GitHub release
    needs: c-library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            /^\[[^]]*\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "Ponko ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::No CARGO_REGISTRY_TOKEN secret: skipped. Set it and re-run this job."
            exit 0
          fi
          cargo publish --workspace
