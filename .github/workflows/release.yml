name: Release

# First fold the changelog fragments in (python3 scripts/changelog.py
# --version X.Y.Z, which also writes the migration chapter of a minor release)
# and name the version in CHANGELOG.md, through a PR, and merge it. Then push
# a tag on the merge commit: v0.2.0 on main or on release-0.2, v0.1.1 on
# release-0.1 (the patch branch of 0.1; main may already hold breaking
# changes), or a release candidate, v0.2.0-rc.1 (a candidate may keep its
# notes under [Unreleased]). The workflow:
#   - verifies, before anything is built: the tag, the crate versions and the
#     CHANGELOG section (which must fit in a GitHub release body) and, for a
#     release with breaking changes, its migration chapter; and that the CI
#     run of the tagged commit on main (or release-X.Y) succeeded, through
#     the Actions API with GITHUB_TOKEN (a run still going is named as such:
#     re-run the job once it finished);
#   - packages every crate (`cargo publish --workspace --dry-run`), so a
#     crate that can't be published stops the release before it exists;
#   - builds the C library on each OS;
#   - waits for a maintainer to approve the `release` environment (repository
#     settings, Environments: required reviewers). That is the only manual
#     step after the tag. Only the `publish` job uses the environment, so one
#     approval covers the GitHub release and crates.io, and nothing is
#     published without it;
#   - `publish` attaches the C library, with the headers, the licenses and
#     the third-party notices of every library linked into it, to a GitHub
#     release whose notes are that version's CHANGELOG section (a candidate's
#     release is marked pre-release), and publishes the crates to crates.io
#     with Trusted Publishing: GitHub OIDC (`id-token: write`) and
#     rust-lang/crates-io-auth-action trade the job's identity for a
#     crates.io token that expires after 30 minutes, so no registry token is
#     stored anywhere. Each crate must list this repository, this workflow
#     file and the `release` environment as a trusted publisher (crates.io,
#     the crate's Settings, Trusted Publishing; CONTRIBUTING.md "Releasing"
#     has the checklist); until then the job stops with a message saying so,
#     before it creates anything, and can be re-run once it is set up. A
#     candidate's crates are at X.Y.Z-rc.N, which crates.io and Cargo treat as
#     a pre-release: `cargo add ponko` and `ponko = "0.2"` never select them;
#   - redeploys the website and guide (`website`), if the
#     PONKO_WEBSITE_DEPLOY_HOOK secret exists;
#   - builds the web gallery of the examples for the tag and checks every
#     page in headless Chromium (`gallery`, no permissions; before approval),
#     and once the release is published deploys it to the repository's GitHub
#     Pages with the built-in token (`gallery-pages`), for a release (not a
#     candidate) that is the newest version (web/gallery/README.md).
# Triggers: only a tag push. Never pull_request_target or workflow_run: they
# run with secrets and write access on input an outsider can influence.
on:
  push:
    tags: ["v*"]

# Read-only unless a job says otherwise.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  c-library:
    name: C library (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ponko_ffi
      - name: Package
        shell: bash
        run: |
          dir="ponko-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp include/ponko.h include/ponko.hpp "$dir/include/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$dir/"
          # Every library linked into ponko_ffi on this OS, with its license
          # texts (wgpu, rapier, kira, the bundled fonts, ...).
          python scripts/package-coin-dash.py notices --crate ponko_ffi \
            --title "the Ponko C library" --out "$dir/THIRD-PARTY-NOTICES.txt"
          for f in libponko_ffi.a libponko_ffi.so libponko_ffi.dylib ponko_ffi.lib ponko_ffi.dll ponko_ffi.dll.lib; do
            if [ -f "target/release/$f" ]; then cp "target/release/$f" "$dir/lib/"; fi
          done
          ls -R "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ponko-*.*z*

  # Packages and verifies every publishable crate against the others'
  # packaged versions, as crates.io will see them, without uploading.
  publish-check:
    name: Package the crates
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --workspace --dry-run

  # The only job that needs approval (the `release` environment: required
  # reviewers, set up in the repository's settings) and the only one that can
  # publish: it has the write permission and the OIDC token, nothing else has.
  # One job, so one approval covers both the GitHub release and crates.io,
  # and a re-run after a failure (crates.io not set up, a crate refused)
  # carries on: the release is created only if it does not exist yet.
  publish:
    name: Publish (release environment)
    needs: [c-library, publish-check]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        run: python3 scripts/release-check.py notes "$GITHUB_REF_NAME" notes.md
      # Pinned to a commit (v1.0.6): the action's `v1` is a branch, and this
      # job can publish. It hands over a token that lasts 30 minutes and
      # revokes it when the job ends. If the exchange fails, nothing has been
      # created yet; the next step says why and stops.
      - name: Get a crates.io token (Trusted Publishing)
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      - name: Trusted Publishing is not set up
        if: steps.auth.outcome == 'failure'
        run: |
          echo "::error title=crates.io Trusted Publishing is not set up::crates.io refused this workflow's identity, so nothing was released. A maintainer adds ${GITHUB_REPOSITORY} with the workflow file release.yml and the environment release as a trusted publisher of every crate (crates.io, the crate's Settings, Trusted Publishing); the steps are in CONTRIBUTING.md, \"Releasing\". Then re-run this job."
          exit 1
      # release-check.py lets only vX.Y.Z and vX.Y.Z-rc.N through, so a
      # suffix means a release candidate. GitHub picks the "latest" release by
      # date and version itself: a 0.1.x patch release made after 0.2.0 does
      # not take the badge from it, and a pre-release never has it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already (a re-run): keeping it."
            exit 0
          fi
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Ponko ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md "${flags[@]}"
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if ! cargo publish --workspace; then
            echo "::error title=cargo publish failed::If crates.io says a crate is not allowed to publish with this token, add Trusted Publishing for that crate (CONTRIBUTING.md, \"Releasing\"; a crate that never was on crates.io needs its first version published by a maintainer with an API token). Then re-run this job."
            exit 1
          fi

  # Redeploys ponko.dev, which builds the guide from the engine's main (its own
  # repository, DEPLOYMENT.md there). Needs the PONKO_WEBSITE_DEPLOY_HOOK
  # secret: the URL of a Cloudflare Pages deploy hook for the website's main
  # branch. The only secret the release uses besides the built-in token, and a
  # deploy hook is not a registry token. Without it this job says so and
  # succeeds: the website's next deployment picks the guide up.
  website:
    name: Redeploy the website
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger the deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.PONKO_WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::No PONKO_WEBSITE_DEPLOY_HOOK secret: the website was not redeployed. Retry the deploy in Cloudflare Pages, or add the secret (CONTRIBUTING.md, \"Releasing\") and re-run this job."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "Redeploy of the website requested."

  # The web gallery (web/gallery/README.md): every example of
  # web/gallery/examples.json built for the browser, a page each with its
  # source at this tag, and an index. Each page is opened in headless Chromium
  # on WebGL2 (WebGPU hidden; what visitors without WebGPU get, and what a
  # GPU-less runner can draw): it must start, keep drawing, survive a click
  # and not be blank, or, for a demo that needs WebGPU, say so. Publishes
  # nothing: the site goes up as an artifact for `gallery-pages`.
  gallery:
    name: Web gallery (build and check)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Find the wasm-bindgen version in Cargo.lock
        run: echo "WASM_BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - name: Install the browser runner and Chromium's headless shell
        run: |
          npm ci --prefix web/smoke --no-audit --no-fund
          bash scripts/ci-retry.sh node web/smoke/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - name: Gallery tests (manifest, pages, check decisions)
        run: node --test web/gallery/*.test.mjs web/smoke/gallery-lib.test.mjs
      - name: Build the gallery for the tag
        run: node web/gallery/build.mjs --ref "$GITHUB_REF_NAME" --out target/web/gallery
      - name: Check every page (Chromium, WebGL2)
        run: node web/smoke/gallery.mjs --dir target/web/gallery --browser chromium --backend webgl2
      - name: Summary of every page
        if: ${{ !cancelled() }}
        run: node web/smoke/summary.mjs target/web-smoke
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: gallery-check
          path: target/web-smoke
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/web/gallery
          retention-days: 7

  # Puts the gallery on GitHub Pages (https://ponkoengine.github.io/ponko/),
  # after the approved `publish`, with the built-in token only. A candidate
  # gets no gallery, and neither does a release older than the newest one (a
  # patch of an older minor), so the gallery always shows the newest release.
  # Pages must be set up once (CONTRIBUTING.md, "One-time setup"): without it
  # this job says so and skips the deployment. Re-run it once it is set up.
  gallery-pages:
    name: Publish the web gallery (GitHub Pages)
    needs: [publish, gallery]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # deploy, and read whether Pages is set up
      id-token: write # deploy-pages proves the deployment came from this run
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, to find the newest release
      - name: Is this the newest release, and is Pages set up?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git tag --list 'v[0-9]*' | grep -v -- - | sort -V | tail -n 1)
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::$GITHUB_REF_NAME is not the newest release ($newest is): the gallery keeps showing $newest."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2> /dev/null) || [ "$source" != workflow ]; then
            echo "::warning::GitHub Pages is not set up to deploy from GitHub Actions (Settings, Pages, Source: GitHub Actions), so the web gallery was not published. Set it up (CONTRIBUTING.md, \"One-time setup\") and re-run this job."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        id: deploy
        if: steps.check.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5

  # Every release job depends on this one (c-library and publish-check, then
  # publish and website through them, and the gallery): nothing is built, released or
  # published unless the tag, the crates' versions and the CHANGELOG section
  # agree, the section fits in a GitHub release body (125,000 characters),
  # the tagged commit was merged to main or to the release-X.Y branch of the
  # tag's minor (scripts/release-check.py check), and CI succeeded on it
  # there (release-check.py ci).
  verify:
    name: Check the tag
    if: github.ref_type == 'tag' && !endsWith(github.ref_name, '-desktop-dry-run')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the CI runs of the tagged commit
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check looks for the tag's commit on main or release-X.Y
      - run: python3 scripts/release-check.py check "$GITHUB_REF_NAME" --on-branch
      - name: CI succeeded on the tagged commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release-check.py ci "$GITHUB_REF_NAME"
