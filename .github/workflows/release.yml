name: Release

# First fold the changelog fragments in (python3 scripts/changelog.py) and
# name the version in CHANGELOG.md, through a PR. Then push a tag like
# v1.0.0 (on a commit of main whose CI passed):
#   - builds the C library on each OS and attaches it, with the headers,
#     to a GitHub release whose notes are that version's CHANGELOG section;
#   - attaches Coin Dash desktop archives and their SHA-256 checksums;
#   - publishes the crates to crates.io if the CARGO_REGISTRY_TOKEN secret
#     is set (`gh secret set CARGO_REGISTRY_TOKEN`); otherwise that job says
#     so and does nothing, and can be re-run once the secret exists.
# Desktop signing and upload are independent of the C library and crates.io.
# Re-run failed desktop jobs to attach their assets after a signing outage.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Coin Dash desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_TARGET: ${{ matrix.os == 'windows-2022' && 'x86_64-pc-windows-msvc' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/windows-linker
        if: runner.os == 'Windows'
      - run: python scripts/release-coin-dash.py check-version
        if: github.event_name == 'push'
      - run: python scripts/release-coin-dash.py selftest
      - run: cargo build --locked --release --example coin_dash
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
      - run: python scripts/package-coin-dash.py package --no-build --out target/desktop-release
      - name: Prepare bundle and sign when configured
        id: signing
        env:
          WINDOWS_SIGN_PFX: ${{ github.event_name == 'push' && runner.os == 'Windows' && secrets.WINDOWS_SIGN_PFX || '' }}
          WINDOWS_SIGN_PASSWORD: ${{ github.event_name == 'push' && runner.os == 'Windows' && secrets.WINDOWS_SIGN_PASSWORD || '' }}
          MACOS_SIGN_P12: ${{ github.event_name == 'push' && runner.os == 'macOS' && secrets.MACOS_SIGN_P12 || '' }}
          MACOS_SIGN_PASSWORD: ${{ github.event_name == 'push' && runner.os == 'macOS' && secrets.MACOS_SIGN_PASSWORD || '' }}
          MACOS_SIGN_IDENTITY: ${{ github.event_name == 'push' && runner.os == 'macOS' && secrets.MACOS_SIGN_IDENTITY || '' }}
          MACOS_NOTARY_APPLE_ID: ${{ github.event_name == 'push' && runner.os == 'macOS' && secrets.MACOS_NOTARY_APPLE_ID || '' }}
          MACOS_NOTARY_PASSWORD: ${{ github.event_name == 'push' && runner.os == 'macOS' && secrets.MACOS_NOTARY_PASSWORD || '' }}
          MACOS_NOTARY_TEAM_ID: ${{ github.event_name == 'push' && runner.os == 'macOS' && secrets.MACOS_NOTARY_TEAM_ID || '' }}
        run: python scripts/release-coin-dash.py sign --package target/desktop-release
      - name: Archive, unpack, smoke-test and checksum
        env:
          COIN_DASH_SIGNED: ${{ steps.signing.outputs.signed }}
          COIN_DASH_NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: python scripts/release-coin-dash.py archive --package target/desktop-release --out desktop-assets
      - uses: actions/upload-artifact@v7
        with:
          name: coin-dash-${{ matrix.os }}
          path: desktop-assets/coin-dash-*
          if-no-files-found: error

  desktop-dry-run:
    name: Attach desktop archives to draft
    if: github.event_name == 'push' && endsWith(github.ref_name, '-desktop-dry-run')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: coin-dash-*
          path: dist
          merge-multiple: true
      - name: Create desktop dry-run draft
        run: |
          gh release create "$GITHUB_REF_NAME" dist/coin-dash-* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "Coin Dash desktop dry run ($GITHUB_REF_NAME)" \
            --notes "Desktop packaging rehearsal. The runner logs report which signing steps ran."
        env:
          GH_TOKEN: ${{ github.token }}

  c-library:
    if: ${{ github.event_name == 'push' && !endsWith(github.ref_name, '-desktop-dry-run') }}
    name: C library (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ponko_ffi
      - name: Package
        shell: bash
        run: |
          dir="ponko-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp include/ponko.h include/ponko.hpp include/crabby.h include/crabby.hpp "$dir/include/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$dir/"
          for f in libponko_ffi.a libponko_ffi.so libponko_ffi.dylib ponko_ffi.lib ponko_ffi.dll ponko_ffi.dll.lib; do
            if [ -f "target/release/$f" ]; then cp "target/release/$f" "$dir/lib/"; fi
          done
          ls -R "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ponko-*.*z*

  github-release:
    name: GitHub release
    needs: c-library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '{linux-x86_64,macos-arm64,windows-x86_64}'
          path: dist
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            /^\[[^]]*\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Ponko ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  desktop-upload:
    name: Attach desktop archives to release
    needs: [github-release, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: coin-dash-*
          path: dist
          merge-multiple: true
      - run: gh release upload "$GITHUB_REF_NAME" dist/coin-dash-* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::No CARGO_REGISTRY_TOKEN secret: skipped. Set it and re-run this job."
            exit 0
          fi
          cargo publish --workspace
