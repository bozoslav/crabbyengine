name: Release

# First fold the changelog fragments in (python3 scripts/changelog.py
# --version X.Y.Z, which also writes the migration chapter of a minor release)
# and name the version in CHANGELOG.md, through a PR. Then push a tag like
# v0.1.0 (on a commit of main whose CI passed):
#   - checks the tag, the crate versions and the CHANGELOG section (which
#     must fit in a GitHub release body) and, for a release with breaking
#     changes, its migration chapter before anything is built;
#   - packages every crate (`cargo publish --workspace --dry-run`), so a
#     crate that can't be published stops the release before it exists;
#   - builds the C library on each OS and attaches it, with the headers,
#     the licenses and the third-party notices of every library linked into
#     it, to a GitHub release whose notes are that version's CHANGELOG section;
#   - publishes the crates to crates.io if the CARGO_REGISTRY_TOKEN secret
#     is set (`gh secret set CARGO_REGISTRY_TOKEN`); otherwise that job says
#     so and does nothing, and can be re-run once the secret exists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  c-library:
    name: C library (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ponko_ffi
      - name: Package
        shell: bash
        run: |
          dir="ponko-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$dir/include" "$dir/lib"
          cp include/ponko.h include/ponko.hpp "$dir/include/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$dir/"
          # Every library linked into ponko_ffi on this OS, with its license
          # texts (wgpu, rapier, kira, the bundled fonts, ...).
          python scripts/package-coin-dash.py notices --crate ponko_ffi \
            --title "the Ponko C library" --out "$dir/THIRD-PARTY-NOTICES.txt"
          for f in libponko_ffi.a libponko_ffi.so libponko_ffi.dylib ponko_ffi.lib ponko_ffi.dll ponko_ffi.dll.lib; do
            if [ -f "target/release/$f" ]; then cp "target/release/$f" "$dir/lib/"; fi
          done
          ls -R "$dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ponko-*.*z*

  # Packages and verifies every publishable crate against the others'
  # packaged versions, as crates.io will see them, without uploading.
  publish-check:
    name: Package the crates
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --workspace --dry-run

  github-release:
    name: GitHub release
    needs: [c-library, publish-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        run: python3 scripts/release-check.py notes "$GITHUB_REF_NAME" notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "Ponko ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA and udev headers (audio, gamepads)
        run: bash scripts/ci-apt-install.sh libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::No CARGO_REGISTRY_TOKEN secret: skipped. Set it and re-run this job."
            exit 0
          fi
          cargo publish --workspace

  # Every release job depends on this one (c-library and publish-check, then
  # github-release and crates-io through them): nothing is built, released or
  # published unless the tag, the crates' versions and the CHANGELOG section
  # agree, the section fits in a GitHub release body (125,000 characters), and
  # the tagged commit was merged to main (scripts/release-check.py).
  verify:
    name: Check the tag
    if: github.ref_type == 'tag' && !endsWith(github.ref_name, '-desktop-dry-run')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check looks for the tag's commit on main
      - run: python3 scripts/release-check.py check "$GITHUB_REF_NAME" --on-main
