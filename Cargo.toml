[package]
name = "crabbyengine"
version = "0.1.0"
description = "A fast 2D game engine for simulating millions of things: ECS on all cores, hot reload, an in-game inspector, AI-agent control, and a C++ API."
keywords = ["gamedev", "engine", "2d", "ecs", "simulation"]
categories = ["game-engines", "game-development", "simulation"]
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://bozoslav.github.io/crabbyengine/api/crabbyengine/"

[dependencies]
crabby_ecs = { path = "crates/crabby_ecs", features = ["serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.34.2", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.1", optional = true }
winit = { version = "0.30.13", optional = true }
puffin = { version = "0.20.0", optional = true }
puffin_http = { version = "0.17.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rayon = "1.12.0"
fontdue = "0.9.5"
epaint_default_fonts = "0.37.0"
kira = { version = "0.12.6", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm", "mp3", "flac"], optional = true }
egui = { version = "0.37", default-features = false, features = ["default_fonts"], optional = true }
egui-wgpu = { version = "0.37", default-features = false, optional = true }
egui-winit = { version = "0.37", default-features = false, optional = true }
subsecond = { version = "0.7.10", optional = true }
dioxus-devtools = { version = "0.7.10", default-features = false, optional = true }
# `Instant` that also works in browsers; on desktop it is std's own type.
web-time = "1.1.0"
gilrs = { version = "0.11.2", optional = true }

[target.'cfg(any(unix, windows))'.dependencies]
libc = "0.2"

# The web build (wasm32): the browser APIs for the canvas and fetching
# assets, and WebGL2 for browsers without WebGPU.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", optional = true, features = ["webgl"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
# Sound through WebAudio (kira plays through cpal).
cpal = { version = "0.18.2", features = ["wasm-bindgen"], optional = true }
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "Response", "console"] }

[features]
default = ["audio", "window", "inspector", "gamepad"]
# A window and GPU rendering (winit + wgpu). Off: `Game::run_headless` only,
# for simulation servers and CI; drawing calls do nothing, `Game::run` panics.
window = ["dep:wgpu", "dep:winit", "dep:pollster"]
# Sound with kira. Off: the sound API stays and is silent (for servers).
audio = ["dep:kira", "dep:cpal"]
# The runtime inspector (egui overlay, toggled with the ` key): entities and their
# components with live editing, resources, system timings, sim controls.
# Off: no egui in the build.
inspector = ["window", "dep:egui", "dep:egui-wgpu", "dep:egui-winit"]
# Gamepads through gilrs (Xbox, PlayStation, Switch and other controllers).
# Off: `ctx.gamepads()` is always empty. On Linux it needs libudev headers.
gamepad = ["window", "dep:gilrs"]
# Frame profiler: per-system scopes, viewable live with `puffin_viewer`
# (cargo install puffin_viewer; connects to 127.0.0.1:8585).
profiling = ["dep:puffin", "dep:puffin_http"]
# Hot-patch system code while the game runs, keeping all its state: run
# with Dioxus's CLI, `dx serve --hot-patch --features hotpatch` (see the
# guide's "Changing code while the game runs" chapter). Off: systems are called directly.
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]

[workspace]
members = [".", "crates/crabby_ecs", "crates/crabby_bench", "crates/crabby_mcp", "crates/crabby_ffi"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Leon Mamić and Crabby Engine contributors"]
repository = "https://github.com/bozoslav/crabbyengine"
homepage = "https://bozoslav.github.io/crabbyengine/"

# Debug builds with light optimization: games and tests run 5-6x faster
# (boids 6.5 -> 1.1 ms/tick at 20k), edit -> build stays ~0.6 s, debug info
# stays. Clean builds take longer (16 -> 25 s for the test suite).
[profile.dev]
opt-level = 1
