[package]
name = "ponko_bevy_scenes"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_camera",
    "bevy_light",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_anti_alias",
    "tonemapping_luts",
    "zstd_rust",
    "png",
] }
serde_json = "1.0.154"

[workspace]
