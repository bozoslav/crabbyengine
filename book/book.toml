[book]
title = "Ponko"
description = "A code-first 2D and 3D game engine with integrated simulation and AI-assisted development tools."
authors = ["Ponko contributors"]
language = "en"
src = "src"

[output.html]
additional-css = ["theme/lang-pair.css"]
git-repository-url = "https://github.com/ponkoengine/ponko"
edit-url-template = "https://github.com/ponkoengine/ponko/edit/main/book/{path}"
site-url = "/ponko/"

[output.html.search]
enable = true
limit-results = 30
boost-title = 2
boost-hierarchy = 2

# Puts a note under every chapter title saying which version the guide
# documents (scripts/guide-versions.py). The command runs from the book folder.
# Optional: a machine without python3 still builds the book, without the note.
[preprocessor.guide-version]
command = "python3 ../scripts/guide-versions.py preprocess"
optional = true
