[package]
name = "crabby_ecs"
version = "0.1.0"
edition = "2024"
description = "The entity-component-system behind Crabby Engine: archetype storage, runtime-registered components."

[features]
default = ["parallel"]
# Multi-core queries (`par_for_each`) via rayon.
parallel = ["dep:rayon"]
# `Entity` as serde Serialize/Deserialize (its 64-bit id), for saving.
serde = ["dep:serde"]

[dependencies]
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
