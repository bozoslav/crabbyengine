[package]
name = "crabby_ffi"
version = "0.1.0"
description = "C API for Crabby Engine; include/crabby.hpp wraps it for C++17."
keywords = ["gamedev", "ffi", "c", "cpp"]
categories = ["game-engines", "api-bindings"]
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["audio", "window", "inspector", "gamepad"]
# A window and GPU rendering. Off: crabby_game_run fails with an error and
# only headless runs work, from a build half the size.
window = ["crabbyengine/window"]
# Sound through the engine's audio feature. Off: sound calls succeed silently.
audio = ["crabbyengine/audio"]
# The runtime inspector overlay (backquote key); see crabby_game_inspector.
inspector = ["crabbyengine/inspector"]
# Gamepads (crabby_ctx_gamepad_*). Off: no pads are ever connected.
gamepad = ["crabbyengine/gamepad"]

[dependencies]
crabbyengine = { path = "../..", default-features = false }
crabby_ecs = { path = "../crabby_ecs" }
rayon = "1.12.0"
serde_json = "1.0.154"

[build-dependencies]
cbindgen = { version = "0.29.2", default-features = false }
