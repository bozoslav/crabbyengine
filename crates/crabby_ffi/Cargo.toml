[package]
name = "crabby_ffi"
version = "1.0.0"
description = "C API for Crabby Engine; include/crabby.hpp wraps it for C++17."
keywords = ["gamedev", "ffi", "c", "cpp"]
categories = ["game-engines", "api-bindings"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["audio", "window", "inspector", "gamepad", "physics"]
# A window and GPU rendering. Off: crabby_game_run fails with an error and
# only headless runs work, from a build half the size.
window = ["crabbyengine/window"]
# Sound through the engine's audio feature. Off: sound calls succeed silently.
audio = ["crabbyengine/audio"]
# The runtime inspector overlay (backquote key); see crabby_game_inspector.
inspector = ["crabbyengine/inspector"]
# Gamepads (crabby_ctx_gamepad_*). Off: no pads are ever connected.
gamepad = ["crabbyengine/gamepad"]
# 2D physics with rapier (crabby_game_physics, rigid bodies, colliders, rays).
# Off: those calls fail with an error.
physics = ["crabbyengine/physics"]
# Lockstep over Steam (crabby_game_lockstep_steam_*). Off by default: it
# links libsteam_api, which then ships next to the game. Off: those calls
# fail with an error.
steam = ["crabbyengine/steam"]

[dependencies]
crabbyengine = { path = "../..", version = "1.0.0", default-features = false, features = ["3d"] }
crabby_ecs = { path = "../crabby_ecs", version = "1.0.0" }
rayon = "1.12.0"
serde_json = "1.0.154"

[dev-dependencies]
cbindgen = { version = "0.29.2", default-features = false }
