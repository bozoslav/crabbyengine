[package]
name = "ponko_ecs"
version = "0.1.0"
keywords = ["ecs", "gamedev", "archetype", "simulation"]
categories = ["game-development", "data-structures"]
documentation = "https://docs.rs/ponko_ecs/"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The entity-component-system behind Ponko: archetype storage, runtime-registered components."

[features]
default = ["parallel", "derive"]
# Multi-core queries (`par_for_each`) via rayon.
parallel = ["dep:rayon"]
# `#[derive(Component)]` (from `ponko_macros`), exported as `ponko_ecs::Component`
# next to the trait. Off: write `impl Component for Type {}` instead.
derive = ["dep:ponko_macros"]
# `Entity` as serde Serialize/Deserialize (its 64-bit id), for saving.
serde = ["dep:serde"]

[dependencies]
ponko_macros = { path = "../ponko_macros", version = "0.1.0", optional = true }
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
