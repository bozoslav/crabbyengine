[package]
name = "ponko_mcp"
version = "0.1.0"
keywords = ["mcp", "gamedev", "agents", "ai"]
categories = ["game-development", "development-tools"]
documentation = "https://docs.rs/ponko_mcp/"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server that lets AI agents inspect and drive running Ponko games"

[[bin]]
name = "ponko-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.154"

[dev-dependencies]
ponko = { path = "../..", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
