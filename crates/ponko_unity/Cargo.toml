[package]
name = "ponko_unity"
description = "Reads Unity projects (text YAML scenes, prefabs, materials and meshes, .meta GUIDs) for importing into Ponko"
version = "0.1.0"
keywords = ["gamedev", "unity", "importer", "yaml", "gltf"]
categories = ["game-development", "parser-implementations"]
documentation = "https://docs.rs/ponko_unity/"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
yaml-rust2 = "0.10"
serde_json = "1"
glam = "0.34.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "tiff", "bmp"] }
rayon = "1.12.0"
ufbx = "0.11.5"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
